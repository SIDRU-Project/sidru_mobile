name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Version fijada (la misma del build de iOS): con "stable" a secas el CI tomaba
      # cada release nueva y sus deprecaciones rompian flutter analyze sin cambios en el codigo.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true
      # El .env esta en .gitignore pero pubspec.yaml lo declara como asset:
      # sin el archivo, analyze falla (asset_does_not_exist) y el build no compila.
      - name: Crear .env
        run: |
          cat > .env <<'EOF'
          API_BASE_URL=http://sidru-209313030.eastus2.cloudapp.azure.com:8080/api/v1
          APP_NAME=SIDRU
          EOF
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
